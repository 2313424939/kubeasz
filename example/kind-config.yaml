# KIND cluster configuration for kubeasz container deployment mode
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubeasz-container

# Networking configuration
networking:
  # WARNING: It is _strongly_ recommended that you keep this the default
  # (127.0.0.1) for security reasons. However it is possible to change this.
  apiServerAddress: "127.0.0.1"
  # By default the API server listens on a random open port.
  # You may choose a specific port but probably don't need to in most cases.
  # Using a random port makes it easier to spin up multiple clusters.
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"

# Node configuration
nodes:
# Control plane node
- role: control-plane
  image: kindest/node:v1.31.0
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraPortMappings:
  # Allow access to the API server from outside the container
  - containerPort: 6443
    hostPort: 6443
    protocol: TCP
  # Allow access to ingress controller
  - containerPort: 80
    hostPort: 80
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
  # Allow access to NodePort services
  - containerPort: 30000
    hostPort: 30000
    protocol: TCP
  - containerPort: 30001
    hostPort: 30001
    protocol: TCP
  - containerPort: 30002
    hostPort: 30002
    protocol: TCP

# Worker nodes (optional, can be scaled)
- role: worker
  image: kindest/node:v1.31.0
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "node-type=worker"

# Additional worker node (optional)
# - role: worker
#   image: kindest/node:v1.31.0